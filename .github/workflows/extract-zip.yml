name: Extract site ZIP

on:
  push:
    paths:
      - ppi-site.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract ZIP safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("ppi-site.zip")
          destination = Path("ppi-site").resolve()
          destination.mkdir(parents=True, exist_ok=True)

          with ZipFile(archive) as zipped:
              for member in zipped.infolist():
                  target = (destination / member.filename).resolve()
                  if target != destination and destination not in target.parents:
                      raise SystemExit(f"Unsafe path in ZIP: {member.filename}")
              zipped.extractall(destination)
          PY

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ppi-site/
          if git diff --cached --quiet; then
            echo "No extracted-file changes to commit."
            exit 0
          fi
          git commit -m "Extract ppi-site.zip"
          git push
